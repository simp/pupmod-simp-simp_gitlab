---
HOSTS:
  alma8-server:
    roles:
    - server
    - default
    - master
    - el8
    platform: el-8-x86_64
    box: almalinux/8
    hypervisor: "<%= ENV.fetch('BEAKER_HYPERVISOR', 'vagrant') %>"
    # GitLab omnibus (puma workers + sidekiq + postgres + gitaly) plus a
    # `gitlab-ctl reconfigure` fork does not fit in 4 GB (no swap) -- reconfigure
    # dies with Errno::ENOMEM. 6 GB leaves headroom without changing GitLab's
    # puma worker count.
    vagrant_memsize: 6144
    vagrant_cpus: 4
    family: almalinux-cloud/almalinux-8
    gce_machine_type: n1-standard-2
  alma8-permittedclient:
    roles:
    - client
    - permittedclient
    platform: el-8-x86_64
    box: almalinux/8
    hypervisor: "<%= ENV.fetch('BEAKER_HYPERVISOR', 'vagrant') %>"
    # `dnf install` with EPEL enabled (repo metadata + a package transaction,
    # e.g. net-tools / firewalld) OOMs this client at 1 GB -- a flaky CI
    # failure. 2 GB is reliable and cheap on the 16 GB runner.
    vagrant_memsize: 2048
    vagrant_cpus: 1
    family: almalinux-cloud/almalinux-8
    gce_machine_type: n1-standard-2
  alma8-ldapserver:
    roles:
    - client
    - unknownclient
    - ldapserver
    platform: el-8-x86_64
    box: almalinux/8
    hypervisor: "<%= ENV.fetch('BEAKER_HYPERVISOR', 'vagrant') %>"
    # `dnf install 389-ds-base` (a large package, pulled in by the ds389 module
    # which we can't pass --disablerepo to) OOMs at 1 GB once EPEL metadata is
    # loaded. 2 GB gives dnf the headroom.
    vagrant_memsize: 2048
    vagrant_cpus: 1
    family: almalinux-cloud/almalinux-8
    gce_machine_type: n1-standard-2
CONFIG:
  log_level: verbose
  type: aio
  run_in_parallel:
  - install
  - config
  ssh:
    keepalive: true
    keepalive_interval: 10
    keepalive_maxcount: 60
  puppet_collection: <%= ENV.fetch('BEAKER_PUPPET_COLLECTION', 'openvox8') %>
